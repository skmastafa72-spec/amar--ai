name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build with Buildozer
        uses: digreat/buildozer-action@v2
        with:
          command: buildozer android debug
          buildozer_version: master
          python_version: 3.10
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: amar-ai-apk
          path: bin/*.apk
